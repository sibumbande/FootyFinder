<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061329" />
    <title>Footy Finder Operations</title>
    <script>
      // CEO touch-up batch 3.5, item 3: saved theme, else the computer's setting, before the first paint.
      try {
        var saved = localStorage.getItem('ff-admin-theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
